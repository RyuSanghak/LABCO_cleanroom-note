# 사이트 점검 워크플로
#  - push / PR: 빌드가 되는지, 내부 링크가 깨지지 않았는지 확인한다.
#  - 6시간마다: 배포된 사이트가 살아 있는지 확인하고, 실패하면 이슈를 연다(중복 생성 안 함).
# 배포 자체는 Cloudflare Pages 의 Git 연동이 맡는다(README 참고).
name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-links.mjs dist

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: 사이트 응답 확인
        id: probe
        if: env.SITE_URL != ''
        run: |
          set -e
          code=$(curl -sS -o body.html -w '%{http_code}' --max-time 30 "$SITE_URL/")
          echo "status=$code" >> "$GITHUB_OUTPUT"
          test "$code" = "200"
          grep -q '<title>' body.html
          curl -sSf --max-time 30 "$SITE_URL/tools/iso-class/" -o /dev/null
          curl -sSf --max-time 30 "$SITE_URL/sitemap-index.xml" -o /dev/null
      - name: 실패 시 이슈 생성
        if: failure() && env.SITE_URL != ''
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'incident';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label,
            });
            if (open.length) { core.info('이미 열린 incident 이슈가 있어 새로 만들지 않음'); return; }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `사이트 점검 실패 (${new Date().toISOString().slice(0, 16)} UTC)`,
              labels: [label],
              body: [
                `정기 점검에서 ${process.env.SITE_URL} 이(가) 정상 응답하지 않았습니다.`,
                `HTTP 상태: ${'${{ steps.probe.outputs.status }}' || '알 수 없음'}`,
                '', `실행 로그: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '', '확인 순서: Cloudflare Pages 배포 상태 → 최근 커밋 → DNS/도메인 만료.',
              ].join('\n'),
            });
